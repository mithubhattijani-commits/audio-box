name: Build Audio Box APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Release signing: the keystore is stored ENCRYPTED in the repo
      # (android/app/audiobox-release.keystore.enc) and decrypted here
      # with the KEYSTORE_PASSPHRASE repo secret. The same passphrase
      # is the keystore password AND the key password, and the key
      # alias is "audiobox". Every release build is signed with the
      # SAME permanent key, so the installed app updates in place
      # without uninstalling.
      - name: Decrypt release keystore
        run: openssl enc -d -aes-256-cbc -salt -pbkdf2 -in android/app/audiobox-release.keystore.enc -out android/app/release.keystore -pass pass:"${{ secrets.KEYSTORE_PASSPHRASE }}"

      # v1.0.11: TWO builds from the same tree. The universal APK
      # (~295 MB, all ABIs) is the fallback the updater serves when no
      # per-ABI URL matches; the split APKs (~120 MB each) are what the
      # updater serves per device ABI.
      - name: Build release APK (universal)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
          KEY_ALIAS: audiobox
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://znyaxxkhhopdqrvxhxmb.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build release APKs (split per ABI)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
          KEY_ALIAS: audiobox
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=https://znyaxxkhhopdqrvxhxmb.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Verify APKs
        run: |
          AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | head -1)
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -1)
          EXPECTED_VC=$(grep -E '^version:' pubspec.yaml | sed 's/.*+//')
          EXPECTED_VN=$(grep -E '^version:' pubspec.yaml | sed 's/^version: //; s/+.*//')
          CERT_SHA256="f0f9b8a7f4c08419604c3e0b1093424ab57977d1470dcc4c21c3be591fb34e2d"
          # Split APKs carry ABI-suffixed versionCodes (Flutter's
          # --split-per-abi scheme: armeabi-v7a = 1000 + base,
          # arm64-v8a = 2000 + base, x86_64 = 4000 + base).
          check_apk() {
            local APK="$1" EXPECTED_CODE="$2"
            ls -la "$APK"
            "$AAPT2" dump badging "$APK" | grep -F "package: name='com.nigraantv.audiobox'"
            "$AAPT2" dump badging "$APK" | grep -F "versionCode='$EXPECTED_CODE'"
            "$AAPT2" dump badging "$APK" | grep -F "versionName='$EXPECTED_VN'"
            "$APKSIGNER" verify --verbose "$APK"
            "$APKSIGNER" verify --print-certs "$APK" | grep -F "Signer #1 certificate SHA-256 digest: $CERT_SHA256"
          }
          check_apk build/app/outputs/flutter-apk/app-release.apk "$EXPECTED_VC"
          check_apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$((1000 + EXPECTED_VC))"
          check_apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$((2000 + EXPECTED_VC))"
          check_apk build/app/outputs/flutter-apk/app-x86_64-release.apk "$((4000 + EXPECTED_VC))"

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-box-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload split APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-box-split-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
